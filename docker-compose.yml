services:
  db:
    image: postgres:16
    container_name: acai-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - acai-data:/var/lib/postgresql/data

volumes:
  acai-data:
